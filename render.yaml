services:
  - type: web
    name: ai-image-studio
    env: python
    buildCommand: |
      npm --prefix frontend install
      npm --prefix frontend run build
      pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false
